name: Cross-Platform Build & Release

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    name: Build on ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            artifact_name: zpaq-linux-x86_64
            # portable AVX2 baseline instead of the runner's -march=native
            archflags: -march=x86-64-v3
          - os: windows-latest
            target: windows-x86_64
            artifact_name: zpaq-windows-x86_64.exe
          - os: macos-latest
            target: macos-arm64
            artifact_name: zpaq-macos-arm64
            archflags: ""

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build and test (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          make -j$(nproc 2>/dev/null || sysctl -n hw.ncpu) ARCHFLAGS="${{ matrix.archflags }}" zpaq
          make ARCHFLAGS="${{ matrix.archflags }}" test
          mv zpaq ${{ matrix.artifact_name }}

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build (Windows MSVC)
        if: runner.os == 'Windows'
        run: |
          cl /O2 /EHsc zpaq.cpp libzpaq.cpp advapi32.lib /Fe:${{ matrix.artifact_name }}

      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: ./tests/fixtures.sh ./${{ matrix.artifact_name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
